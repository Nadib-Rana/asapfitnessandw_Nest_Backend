# ============================================================
# docker-compose.yml — NestJS Backend Template (Development)
# ============================================================
# Services:
#   app      — NestJS backend (built from local Dockerfile)
#   postgres — PostgreSQL database
#   minio    — MinIO object storage (S3-compatible)
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose up -d postgres minio  # start only infra (run app locally)
#   docker compose logs -f app    # tail app logs
#   docker compose down -v        # stop and remove volumes
# ============================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: foremosttrading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foremosttrading_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: foremosttrading_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Application ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: foremosttrading_api
    restart: unless-stopped
    env_file:
      - .env                        # ← secrets come from .env, NOT baked into image
    environment:
      # Override specific variables for Docker networking
      # (service names resolve as hostnames inside docker network)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/foremosttrading_db
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      STORAGE_PUBLIC_URL: http://localhost:9000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
